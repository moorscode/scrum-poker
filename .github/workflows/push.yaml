name: Push checks
on: push
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 24
        cache: yarn
    - name: Install modules
      run: yarn install --frozen-lockfile
    - name: Check code coverage
      run: yarn cs
    - name: Run all unit tests
      run: yarn test
    - name: Build the files
      run: |
        cp .env.example .env
        yarn build
